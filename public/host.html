<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TickBox — Presenter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235B3DF5'/%3E%3Cpath d='M8 16.5l5 5L24 10' stroke='white' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="home hidden" id="home">
  <aside class="home-side">
    <a class="logo" href="/"><span class="logo-mark"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="logo-word">tick<b>box</b></span></a>
    <div class="new-wrap">
      <button class="new-slide" id="hNew" data-ic="plus">New presentation</button>
      <div class="new-menu hidden" id="hNewMenu">
        <button data-new="blank"><span class="t-ic" data-ic="mc"></span><span><b>Blank presentation</b><small>Start from an empty slide</small></span></button>
        <button data-new="quiz"><span class="t-ic t-quiz" data-ic="quiz"></span><span><b>Quiz competition</b><small>Speed quiz with leaderboards</small></span></button>
        <button data-new="paste"><span class="t-ic t-leaderboard" data-ic="paste"></span><span><b>Paste quiz questions</b><small>Turn a list into a quiz</small></span></button>
        <button data-new="csv"><span class="t-ic t-mc" data-ic="sheet"></span><span><b>Import from spreadsheet</b><small>Questions + answers from a .csv</small></span></button>
        <button data-new="import"><span class="t-ic t-qa" data-ic="download"></span><span><b>Import presentation</b><small>Open a TickBox .json file</small></span></button>
      </div>
    </div>
    <nav class="side-nav">
      <button class="sn on" data-view="home" data-ic="home">Home</button>
      <button class="sn" data-view="mine" data-ic="folder">My presentations</button>
      <button class="sn" data-view="templates" data-ic="copy">Templates</button>
    </nav>
    <div class="side-foot">
      <a class="sn" href="/join" data-ic="phone">Join a presentation</a>
      <p>Presentations are saved in this browser.</p>
    </div>
    <input type="file" accept=".json,application/json" id="hImportFile" hidden>
  </aside>
  <main class="home-main" id="homeMain"></main>
</div>

<div class="editor hidden" id="editor">
  <header class="topbar">
    <button class="ibtn back" id="btnHome" title="All presentations" data-ic="left"></button>
    <span class="logo-mark mini"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <div class="title-wrap">
      <input class="title-input" id="deckTitle" placeholder="Presentation title" aria-label="Presentation title">
      <button class="sub-link" id="btnDecks" data-ic="folder">My presentations</button>
    </div>
    <div class="spacer"></div>
    <button class="btn round soft" id="btnPreview" data-ic="eye">Preview</button>
    <button class="btn round primary" id="btnPresent" data-ic="play">Start presentation</button>
  </header>
  <div class="ed-body">
    <aside class="slide-col">
      <button class="new-slide" id="addSlide" data-ic="plus">New slide</button>
      <div class="slide-list" id="slideList"></div>
    </aside>
    <main class="canvas-wrap" id="canvasWrap">
      <div class="starter hidden" id="starter">
        <h2>What would you like to create?</h2>
        <div class="ask-box">
          <textarea id="stText" rows="4" placeholder="Type or paste your questions…&#10;&#10;Put a * before the right answer to make it a quiz question."></textarea>
          <button class="ask-go" id="stGo" title="Create slides" data-ic="arrowup" disabled></button>
        </div>
        <div class="st-hint" id="stHint">Each question becomes a slide · answers marked with * become quiz questions</div>
        <div class="st-actions">
          <button class="btn round" id="stScratch" data-ic="pencil">Start from scratch</button>
          <button class="btn round" id="stCsv" data-ic="sheet">Import CSV</button>
          <label class="btn round" data-ic="download">Import slides<input type="file" accept=".json,application/json" id="stImport" hidden></label>
        </div>
      </div>
      <div class="canvas" id="canvas">
        <div class="stage" id="previewStage"></div>
        <div class="join-strip"><span>Join at <b id="stripHost"></b></span><span class="code">123 456</span></div>
      </div>
      <div class="quick-add" id="quickAdd">
        <span class="qa-label">Add</span>
        <button data-q="quiz" data-ic="quiz">Quiz</button>
        <button data-q="mc" data-ic="mc">Poll</button>
        <button data-q="wordcloud" data-ic="wordcloud">Word cloud</button>
        <button data-q="open" data-ic="open">Open ended</button>
        <button data-q="leaderboard" data-ic="leaderboard">Leaderboard</button>
        <button data-q="more" data-ic="plus">More</button>
        <span class="qa-sep"></span>
        <button id="qaPaste" data-ic="paste">Paste questions</button>
      </div>
    </main>
    <aside class="panel">
      <div class="panel-head">
        <div class="ptabs" role="tablist">
          <button class="ptab on" data-tab="edit" data-ic="pencil">Edit</button>
          <button class="ptab" data-tab="design" data-ic="palette">Design</button>
        </div>
        <span class="hidden" id="panelTitle"></span>
      </div>
      <div class="panel-body" id="props"></div>
    </aside>
  </div>
</div>

<div class="pv hidden" id="pv">
  <div class="pv-stage" id="pvStage"></div>
  <div class="pv-bar">
    <span class="pv-tag">Preview</span>
    <button class="tb" id="pvPrev" data-ic="left" title="Previous (←)"></button>
    <span class="tb-count" id="pvPos"></span>
    <button class="tb" id="pvNext" data-ic="right" title="Next (→)"></button>
    <button class="tb" id="pvClose" data-ic="x" title="Close (Esc)"></button>
  </div>
</div>

<div class="present hidden" id="present">
  <div class="present-top">
    <div></div>
    <div class="live-stats">
      <div class="pill"><span class="live-dot"></span><span><span id="pCount">0</span> joined</span></div>
      <div class="pill" id="rPill" data-ic="check"><span><span id="rCount">0</span> <span id="rLabel">responses</span></span></div>
    </div>
  </div>
  <div class="present-stage" id="presentStage"></div>
  <div class="present-controls" id="controls">
    <div class="toolbar">
      <button class="tb" id="cPrev" title="Previous (←)" data-ic="left"></button>
      <span class="tb-count" id="cPos">1 / 1</span>
      <button class="tb tb-next" id="cNext" title="Next (→ or Space)"></button>
      <span class="tb-sep"></span>
      <button class="tb" id="cQuiz" title="Run this question again" data-ic="reset"></button>
      <button class="tb" id="cOpen" title="Close voting"></button>
      <button class="tb" id="cHide" title="Hide results (H)"></button>
      <button class="tb" id="cPhones" title="Show results on phones" data-ic="phone"></button>
      <span class="tb-sep"></span>
      <button class="tb" id="cQR" title="Show join QR code (Q)" data-ic="qr"></button>
      <button class="tb" id="cReset" title="Clear responses on this slide" data-ic="reset"></button>
      <button class="tb" id="cExport" title="Download results (CSV)" data-ic="download"></button>
      <button class="tb" id="cFull" title="Fullscreen (F)" data-ic="expand"></button>
      <button class="tb tb-end" id="cEnd" title="End session" data-ic="x"></button>
    </div>
  </div>
  <div class="joinbar" id="joinbar" title="Show large QR code (Q)">
    <img id="qrSmall" alt="QR code to join">
    <span class="txt">Join at <b id="joinHost"></b></span>
    <span class="code" id="joinCode"></span>
  </div>
  <div class="reaction-layer" id="reactions"></div>
</div>

<div class="toast" id="toast"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/viz.js"></script>
<script src="/js/host.js"></script>
</body>
</html>
