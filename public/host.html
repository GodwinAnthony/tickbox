<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TickBox — Presenter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235B3DF5'/%3E%3Cpath d='M8 16.5l5 5L24 10' stroke='white' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="editor" id="editor">
  <div class="topbar">
    <a class="logo" href="/"><span class="logo-mark"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="logo-word">tick<b>box</b></span></a>
    <input class="title-input" id="deckTitle" placeholder="Presentation title" aria-label="Presentation title">
    <div class="spacer"></div>
    <button class="btn ghost sm" id="btnDecks">📁 My presentations</button>
    <button class="btn ghost sm" id="btnSettings">⚙️ Settings</button>
    <button class="btn primary" id="btnPresent">▶ Present</button>
  </div>
  <div class="ed-body">
    <div class="slide-list" id="slideList"></div>
    <div class="preview-wrap">
      <div class="preview-frame"><div class="stage" id="previewStage"></div></div>
      <div class="preview-note">Preview with sample results · the audience sees a simple voting screen on their phones</div>
    </div>
    <div class="props" id="props"></div>
  </div>
</div>

<div class="present hidden" id="present">
  <div class="present-top">
    <div class="joinbar" id="joinbar" title="Show large QR code (Q)">
      <img id="qrSmall" alt="QR code to join">
      <div class="txt">Join at <b id="joinHost"></b><br>use code</div>
      <div class="code" id="joinCode"></div>
    </div>
    <div class="live-stats">
      <div class="pill"><span class="live-dot"></span><span><span id="pCount">0</span> joined</span></div>
      <div class="pill" id="rPill">✓ <span><span id="rCount">0</span> <span id="rLabel">responses</span></span></div>
    </div>
  </div>
  <div class="present-stage" id="presentStage"></div>
  <div class="present-controls" id="controls">
    <div class="ctrl-group">
      <button class="btn" id="cPrev" title="Previous (←)">‹ Prev</button>
      <span class="count" id="cPos">1 / 1</span>
      <button class="btn" id="cNext" title="Next (→)">Next ›</button>
    </div>
    <div class="ctrl-group">
      <button class="btn" id="cQuiz">⚡ Start quiz</button>
      <button class="btn" id="cOpen" title="Open / close voting">🔓 Voting open</button>
      <button class="btn" id="cHide" title="Hide results (H)">🙈 Hide results</button>
      <button class="btn" id="cPhones" title="Show results on phones">📱 Results on phones</button>
    </div>
    <div class="ctrl-group">
      <button class="btn" id="cReset" title="Clear responses on this slide">↺ Reset</button>
      <button class="btn" id="cExport" title="Download CSV">⤓ Export</button>
      <button class="btn" id="cFull" title="Fullscreen (F)">⛶</button>
      <button class="btn danger" id="cEnd">✕ End</button>
    </div>
  </div>
  <div class="reaction-layer" id="reactions"></div>
</div>

<div class="toast" id="toast"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/viz.js"></script>
<script src="/js/host.js"></script>
</body>
</html>
